tionally reserve a construction panel. Do not fill it with the correct answer in the question view."},"questions":[{"id":"INTRO-01","title":"A project already under way","topic_id":"INTRO","difficulty":"hard","skills":["marginal analysis","sunk cost","discrete choice"],"stem":"A firm has already paid a nonrefundable $120 setup fee. It may now run 0 to 5 production batches in order; earlier batches are required before later ones. The extra revenue from batches 1 through 5 is $90, $75, $60, $45, and $30. Each batch costs an additional $50 to run. There are no other benefits or costs, and unused capacity has no alternative use. Which continuation decision maximizes profit from this point?","options":[{"id":"A","text":"Run 2 batches because the third batch cannot cover its share of setup cost."},{"id":"B","text":"Run no batches because total project profit is negative at every output."},{"id":"C","text":"Run 5 batches to spread the setup fee across the most output."},{"id":"D","text":"Run 3 batches, although the project as a whole makes a $45 loss."}],"explanation":"Compare each extra batch's revenue with its $50 avoidable cost. The first three add 40 + 25 + 10 = $75; later batches subtract value. Total revenue is $225, new costs are $150, and whole-project profit is 225 - 150 - 120 = -$45. A negative total profit does not imply that stopping now is best.","graph":null,"data":{"columns":["Batch","Extra revenue ($)","Extra cost ($)"],"rows":[[1,90,50],[2,75,50],[3,60,50],[4,45,50],[5,30,50]]},"correct_option":"D","option_feedback":{"A":"The third batch adds $60 revenue against $50 avoidable cost. Allocating sunk cost does not change this gain.","B":"Stopping leaves the entire $120 loss. Continuing with three batches recovers $75.","C":"Batches 4 and 5 reduce profit by $5 and $20, respectively.","D":"The first three batches add $75 to profit; subtracting the sunk $120 gives an overall loss of $45."},"estimated_minutes":3},{"id":"INTRO-02","title":"An upward pattern in mar ants constant; changing income does not test that condition.","B":"Different demand curves can intersect one upward-sloping supply curve at higher prices and quantities.","C":"A change in the good's own price creates a movement along a given demand curve.","D":"A collection of equilibrium points need not lie on one demand curve."},"estimated_minutes":3},{"id":"INTRO-03","title":"Facts about values versus value judgments","topic_id":"INTRO","difficulty":"very_hard","skills":["positive vs normative","conditional reasoning"],"stem":"A policy memo makes three claims: (i) 'A binding rent ceiling would reduce quantity supplied, other things equal'; (ii) 'In a representative survey, 70% of residents said current rents are unfair'; (iii) 'The city should prioritize equality over total housing availability.' Which assessment is most defensible?","options":[{"id":"A","text":"Only (ii) is positive; a prediction such as (i) remains normative until verified."},{"id":"B","text":"Claims (i) and (ii) are positive, while (iii) is normative; verifying the first two does not by itself establish the third."},{"id":"C","text":"Only (i) is positive; (ii) and (iii) are normative because both concern fairness."},{"id":"D","text":"All three become positive if a large enough survey confirms majority support."}],"explanation":"'Positive' concerns whether a claim is empirically assessable, not whether it is true or morally desirable. Both the conditional supply prediction and the reported survey percentage can be tested. The recommendation chooses a social objective. Establishing facts about preferences or outcomes alone does not logically require society to endorse that objective.","graph":null,"data":null,"correct_option":"B","option_feedback":{"A":"A conditional prediction can be positive whether confirmed, refuted, or not yet tested.","B":"A testable report about people's values is a positive claim, even though the reported opinions are evaluative.","C":"Claim (ii) reports a measurable survey result rather than endorsing the respondents' fairness judgment.","D":"Evidence of majority opinion does not turn a policy priority into a purely descriptive claim."},"estimated_minutes":5},{"id":"INTRO-04","title":"New information changes a decision","topic_id":"INTRO","difficulty":"hard","skills":["expected marginal benefit","rational behavior","information"],"stem":"A risk-neutral manager can pay a nonrefundable $40 now to test a process. Success pays an additional $200 and failure pays $0; doing nothing pays $0. The manager initially believes success has probability 0.30. Before paying, reliable evidence reduces that probability to 0.15. Ignoring all other effects, which decision pattern is consistent with maximizing expected monetary payoff?","options":[{"id":"A","text":"Plan to test initially, then cancel after receiving the evidence."},{"id":"B","text":"Test after the update because changing a plan demonstrates irrationality."},{"id":"C","text":"Test under both beliefs because the possible $200 gain exceeds $40."},{"id":"D","text":"Cancel under both beliefs because failure is more likely than success."}],"explanation":"The relevant comparison is expected incremental benefit against incremental cost at the time the decision is made. Since the fee has not been paid, it is avoidable. Updating a choice after a probability revision is not inconsistent behavior.","graph":null,"data":null,"correct_option":"A","option_feedback":{"A":"Expected net payoff changes from 0.30(200)-40 = $20 to 0.15(200)-40 = -$10.","B":"Adapting to relevant new information is consistent with rational choice.","C":"The size of a possible prize must be weighted by its probability under the stated objective.","D":"A low probability can still justify a gamble when the payoff is sufficiently large."},"estimated_minutes":3},{"id":"INTRO-05","title":"Relative rewards and the whole group","topic_id":"INTRO","difficulty":"hard","skills":["fallacy of composition","incentives","relative position"],"stem":"Ten employees compete for exactly three promotions. Each employee can improve their promotion prospects by obtaining a credential when the others do not. Management nevertheless keeps the number of promotions fixed at three if everyone obtains it. Which conclusion is logically warranted?","options":[{"id":"A","text":"Because only three promotions exist, obtaining a credential cannot be individually rational."},{"id":"B","text":"If the credential raises one employee's chance, universal adoption must create more promotions."},{"id":"C","text":"Universal adoption proves that the credential has no educational or productivity value."},{"id":"D","text":"A credential can improve one employee's relative prospects without increasing the group's total promotions."}],"explanation":"This is a fallacy-of-composition problem. An individual can gain relative to others even when the aggregate opportunity is fixed. The question establishes neither that universal adoption is wasteful overall nor that any particular employee should decline the credential.","graph":null,"data":null,"correct_option":"D","option_feedback":{"A":"An individual may rationally seek a larger chance of one of the fixed promotions.","B":"The premise explicitly holds the promotion total fixed.","C":"The promotion cap provides no evidence about learning or productivity.","D":"An individual advantage conditional on others' actions need not scale into an aggregate gain."},"estimated_minutes":3},{"id":"INTRO-06","title":"Efficiency cannot rank preferences","topic_id":"INTRO","difficulty":"hard","skills":["productive efficiency","scarcity","limits of a model"],"stem":"An economy's production frontier is Y = 100 - X for 0 \u003c= X \u003c= 100. Points A=(20,80) and B=(70,30) lie on it; C=(20,30) is feasible. Both goods are desirable and resources can be reallocated freely. Which conclusion follows without knowing society's preferences?","options":[{"id":"A","text":"A and B are productively efficient, but the  use is measured for every household. There are no spillovers between households or differences in measurement. Which comparison best estimates the causal effect of being offered the subsidy?","options":[{"id":"A","text":"Energy use of installers' customers before versus after installation, without a comparison group."},{"id":"B","text":"Energy use of households that accepted versus those that declined the offer."},{"id":"C","text":"Average energy use for all offered households versus all households not offered it."},{"id":"D","text":"Energy use only among offered households that saved the most energy."}],"explanation":"The causal treatment named in the question is the offer, not installation itself. Random assignment balances other determinants in expectation. Comparing voluntary participants with nonparticipants discards that protection. This comparison does not automatically identify the causal effect of actually installing insulation.","graph":null,"data":null,"correct_option":"C","option_feedback":{"A":"Weather, prices, or other time-varying factors could explain part of the change.","B":"Acceptance is a choice and can reflect preexisting differences.","C":"Random assignment supports this comparison, including nonparticipants in the offered group.","D":"Selecting on the outcome cannot estimate the average effect of the offer."},"estimated_minutes":3},{"id":"INTRO-09","title":"A price of zero and an economic cost","topic_id":"INTRO","difficulty":"hard","skills":["scarcity vs shortage","nonmonetary cost","allocation"],"stem":"A museum has 200 identical timed-entry places and gives them away at a money price of zero. At that price, 350 visitors want a place. Waiting in line is required, and waiting time has value to visitors. Which statement is necessarily correct?","options":[{"id":"A","text":"There is a shortage at the posted money price, and obtaining a place can still carry an economic cost."},{"id":"B","text":"The shortage is 350 because all visitors face a zero price."},{"id":"C","text":"A queue guarantees that visitors with the highest money willingness to pay receive the places."},{"id":"D","text":"Free admission eliminates scarcity because nobody pays money."}],"explanation":"Zero money price does not mean zero economic cost. The shortage at the posted price is 150 places; rationing must occur in some form. Queueing may reduce effective demand through time costs, but the facts do not establish an efficient allocation.","graph":null,"data":null,"correct_option":"A","option_feedback":{"A":"Desired places exceed available places by 150, while time spent waiting is a real opportunity cost.","B":"Shortage is quantity demanded minus quantity supplied: 350-200=150.","C":"Willingness to wait also depends on the value of time and does not establish that ranking.","D":"Finite capacity still constrains the number who can attend."},"estimated_minutes":3},{"id":"INTRO-10","title":"Two models agree at one observation","topic_id":"INTRO","difficulty":"hard","skills":["model testing","identification","graph interpretation"],"stem":"Two candidate demand models for the same market are A: Q=120-2P and B: Q=100-P. Both fit the observed point P=20, Q=80. Their other determinants are held fixed. Which proposed new observation could distinguish them under those assumptions?","options":[{"id":"A","text":"Observe P=20, Q=80 again with greater measurement precision."},{"id":"B","text":"Conclude A is correct because its absolute slope is larger."},{"id":"C","text":"Set P=30 in a setting with sufficient stock; A predicts Q=60 and B predicts Q=70."},{"id":"D","text":"Raise P while allowing income to change in an unknown way, then attribute all quantity change to P."}],"explanation":"One observation can be consistent with multiple models. A useful test changes a variable in a way that produces distinct predictions while maintaining the assumptions needed for comparison. With price on the vertical axis, graph A as P=60-Q/2 and B as P=100-Q.","gra 3},{"id":"OC-01","title":"A profitable business using owned resources","topic_id":"OC","difficulty":"hard","skills":["explicit and implicit costs","economic profit","next-best alternatives"],"stem":"A consultant's annual revenue is $240,000 and explicit business expenses are $150,000. Running the business also uses her full-time labor, an owned office, and her own invested funds. In the best feasible alternative, she could simultaneously earn a $50,000 salary, rent the office out for $30,000 net, and earn $5,000 on those funds. There are no other differences, risks, or costs. Which assessment is correct?","options":[{"id":"A","text":"Accounting and economic profit are both $90,000 because she makes no payments to herself."},{"id":"B","text":"Accounting profit is $90,000; economic profit is $5,000, so the business exceeds the stated alternative."},{"id":"C","text":"Economic profit is -$60,000 because explicit expenses must be subtracted twice."},{"id":"D","text":"Economic profit is $40,000 because only the salary is an opportunity cost."}],"explanation":"Accounting profit = 240,000-150,000=$90,000. Implicit cost = 50,000+30,000+5,000=$85,000, making economic profit $5,000. These alternative returns can be added because they involve different resources and can all be realized together.","graph":null,"data":null,"correct_option":"B","option_feedback":{"A":"Owned resources still have valuable forgone uses.","B":"The jointly feasible implicit costs sum to $85,000.","C":"Explicit expenses already appear in accounting profit and should not be counted again.","D":"The office and funds have separate, simultaneously feasible alternative uses."},"estimated_minutes":3},{"id":"OC-02","title":"A ticket with a resale market","topic_id":"OC","difficulty":"hard","skills":["opportunity cost","sunk vs recoverable expenditure","mutually exclusive alternatives"],"stem":"You bought a concert ticket last month for $120. Tonight you may attend, sell it for $80 net and work a shift earning  payoff exceeds selling and investing by $6,000."},{"id":"B","text":"Sell it because keeping costs $100,000 plus the forgone $44,000."},{"id":"C","text":"Keep it because its incremental economic gain is the full $50,000."},{"id":"D","text":"Sell it because $50,000 fails to recover the $100,000 original price."}],"explanation":"Place both options on the same date. The opportunity cost of keeping the machine is 40,000(1.10)=$44,000 at year-end. Keeping yields a $6,000 advantage. Comparing $50,000 directly with today's $40,000 would omit the investment return.","graph":null,"data":null,"correct_option":"A","option_feedback":{"A":"Selling and investing yields $44,000, compared with $50,000 from keeping it.","B":"This counts sunk expenditure as an additional avoidable cost.","C":"Keeping sacrifices the $44,000 year-end alternative.","D":"The original price is sunk for this decision."},"estimated_minutes":3},{"id":"OC-04","title":"Average cost versus the next unit on a frontier","topic_id":"OC","difficulty":"hard","skills":["increasing opportunity cost","discrete PPF","average vs marginal"],"stem":"An economy's efficient frontier contains these (X,Y) combinations, connected in order by straight segments: (0,100), (1,96), (2,88), (3,76), (4,60), (5,40). Relative to producing zero X, what are the opportunity cost of the fourth unit of X and the average opportunity cost of the first four units?","options":[{"id":"A","text":"16 units of Y for the fourth unit; 10 units of Y per X on average."},{"id":"B","text":"12 units of Y for the fourth unit; 15 units of Y per X on average."},{"id":"C","text":"16 units of Y for the fourth unit; 16 units of Y per X on average."},{"id":"D","text":"40 units of Y for the fourth unit; 10 units of Y per X on average."}],"explanation":"The successive opportunity costs of X are 4, 8, 12, 16, and 20 units of Y. Increasing opportunity cost is a statement about these increments. A frontier's coordinates show output levels; costs require differences between the relevant points.","graph":{"status":"rendered_in_offline_quiz","student_caption":"Piecewise-linear frontier through (0,100), (1,96), (2,88), (3,76), (4,60), (5,40).","panels":[{"id":"ppf","x_label":"Good X","y_label":"Good Y","x_range":[0,5.5],"y_range":[0,110],"curves":[{"id":"ppf","label":"PPF","points":[[0,100],[1,96],[2,88],[3,76],[4,60],[5,40]]}],"markers":[]}],"render_notes":"","solution":{"note":"The fourth unit costs 16 Y; the first four cost 10 Y per X on average.","panels":{"ppf":{"markers":[{"label":"Before fourth unit","x":3,"y":76},{"label":"After fourth unit","x":4,"y":60}],"segments":[{"points":[[3,76],[4,76],[4,60]],"label":"Fourth-unit tradeoff"}],"curves":[]}}}},"data":{"columns":["X","Maximum Y"],"rows":[[0,100],[1,96],[2,88],[3,76],[4,60],[5,40]]},"correct_option":"A","option_feedback":{"A":"The fourth costs 76-60=16; the first four cost (100-60)/4=10 each on average.","B":"Twelve is the third unit's cost; remaining Y divided by X is not average forgone Y.","C":"Increasing marginal opportunity costs need not equal their average.","D":"Forty is the total cost of the first four units, not the cost of the fourth."},"estimated_minutes":3},{"id":"OC-05","title":"A frontier that pivots outward","topic_id":"OC","difficulty":"very_hard","skills":["technology","PPF shifts","opportunity cost"],"stem":"The old frontier is Y=80-0.008X^2 and the new frontier is Y=120-0.012X^2, both for 0\u003c=X\u003c=100. All resources are efficiently used on either frontier. Which interpretation is consistent with this change?","options":[{"id":"A","text":"Technology improves Y production: maximum X is unchanged, and at X=50 maximum Y rises from 60 to 90."},{"id":"B","text":"The economy merely moves from unemployment to full employment on the old frontier."},{"id":"C","text":"Maximum production of both goods increases by 50%."},{"id":"D","text":"The opportunity cost of X at every positive X falls because the frontier moves outward."}],"explanation":"At X=0, maximu t different relative costs","topic_id":"OC","difficulty":"hard","skills":["comparative advantage","constant opportunity cost","limits of trade gains"],"stem":"In a one-period model, A can produce either 12 X or 6 Y, while B can produce either 6 X or 3 Y. Both frontiers are straight, there are no scale economies, and exchange and production are costless apart from resource use. Can specialization based only on these production differences create strict gains for both parties at a fixed exchange rate?","options":[{"id":"A","text":"No; strict mutual gains are impossible whenever one party has absolute advantage in both goods."},{"id":"B","text":"No; both have the same opportunity cost, so there is no exchange-rate interval strictly better than self-production for both."},{"id":"C","text":"Yes; trading one X for one Y is strictly beneficial to both."},{"id":"D","text":"Yes; A should export both goods because it has absolute advantage in both."}],"explanation":"Each producer's opportunity cost of X is 0.5 Y. An exchange rate above 0.5 favors the X seller but not the X buyer; a rate below 0.5 reverses that. At 0.5 both can reproduce the tradeoff themselves. The conclusion is specific to this constant-cost model.","graph":null,"data":null,"correct_option":"B","option_feedback":{"A":"Such gains are possible when relative costs differ; here they do not.","B":"Each gives up 0.5 Y per X.","C":"At that rate an X buyer pays more Y than the 0.5 Y needed to produce X.","D":"Absolute advantage does not establish different relative costs."},"estimated_minutes":3},{"id":"OC-09","title":"Constructing a frontier from specialized workers","topic_id":"OC","difficulty":"hard","skills":["resource heterogeneity","efficient allocation","increasing opportunity cost"],"stem":"Three workers each have one day. They may divide it proportionally between two goods, with constant individual productivity. Worker A can make 12 bread or 3 cloth; B can make 8 bread or 4 cloth; C can make 4 bread or 6 cloth. To produce exactly 20 bread while maximizing cloth, which allocation is efficient?","options":[{"id":"A","text":"B and C make only bread, and A spends two-thirds of the day on bread; output is 20 bread and 1 cloth."},{"id":"B","text":"Every worker spends five-sixths of the day on bread; output is 20 bread and 13/6 cloth."},{"id":"C","text":"A and B make bread; C makes cloth, yielding 20 bread and 6 cloth."},{"id":"D","text":"A makes only bread, B spends three-quarters of the day on bread, and C splits the day equally; output is 20 bread and 4 cloth."}],"explanation":"The cloth cost per bread is 3/12=0.25 for A, 4/8=0.5 for B, and 6/4=1.5 for C. Starting from all cloth (13), move A to bread first, then B. The frontier passes through (0,13), (12,10), (20,6), and (24,0). The other listed allocations also produce 20 bread, but leave only 4, 13/6, or 1 cloth. Feasibility alone is not efficiency.","graph":{"status":"rendered_in_offline_quiz","student_caption":"Construct the aggregate PPF from worker productivities; start with 13 cloth and zero bread.","panels":[{"id":"workers","x_label":"Bread","y_label":"Cloth","x_range":[0,26],"y_range":[0,14],"curves":[],"markers":[]}],"render_notes":"Derive the piecewise frontier from the productivity table in the stem. The blank panel is a construction task; do not render solved vertices initially.","solution":{"note":"Reassign A first, then B. At 20 bread, 6 cloth is the efficient maximum.","panels":{"workers":{"curves":[{"id":"frontier","label":"Efficient frontier","points":[[0,13],[12,10],[20,6],[24,0]]}],"markers":[{"label":"Efficient","x":20,"y":6},{"label":"Alternative","x":20,"y":4},{"label":"Equal time","x":20,"y":2.1666666666666665},{"label":"Alternative","x":20,"y":1}]}}}},"data":{"columns":["Worker","Bread per day if specialized","Cloth per day if specialized"],"rows":[["A",12,3],["B",8,4],["C",4,6]]},"correct_option":"C","option_feedback":{"A":"This leaves some of the lowest-cost bread capacity unused while using the highest-cost bread worker.","B":"This feasible equal-time rule ignores differences in comparative advantage and sacrifices too much cloth.","C":"A and B have the lowest cloth opportunity costs per bread, leaving C in its relatively efficient use.","D":"This is feasible, but moving bread production from C to the remaining quarter of B's day raises cloth output by 2 at the same bread total."},"estimated_minutes":3},{"id":"OC-10","title":"Inventory purchased at an old price","topic_id":"OC","difficulty":"hard","skills":["recoverable resources","historical vs opportunity cost","incremental profit"],"stem":"A firm owns 100 units of input purchased for $8 each. It can sell them now for $11 each net, or use them to make 100 finished units selling for $15 each, with an additional processing cost of $3 per finished unit. Replacement inputs cost $12 each, but the firm need not replace any input and has no other orders. Which assessment is correct?","options":[{"id":"A","text":"Sell the stock because using it requires paying $11 and $12 per unit."},{"id":"B","text":"Process the stock; the incremental gain over selling is $400 because the input cost is $8."},{"id":"C","text":"Process the stock; doing so earns $100 more than selling it, and the relevant input opportunity cost is $11 per unit."},{"id":"D","text":"Be indifferent; the relevant input cost must be the $12 replacement price."}],"explanation":"Using inventory forgoes its current net resale value. Processing produces 100(15-3)=$1,200 versus $1,100 from selling stock. Historical acquisition cost is sunk for today's choice, and an unused replacement option does not impose a cost.","graph":null,"data":null,"correct_option":"C","option_feedback":{"A":"The resale value and replacement quotation are not two costs that must both be incurred.","B":"Four dollars per unit is an accounting margin using historical cost, not the advantage over the available alternative.","C":"Finished revenue less processing is $1,200, compared wit ubstitute's price rises $5, and the complement's price rises $10. Supply is unchanged. What is the new equilibrium?","options":[{"id":"A","text":"P=45 and Q=55 because all three price or income increases raise demand."},{"id":"B","text":"P=30 and Q=40 because opposite demand effects always cancel."},{"id":"C","text":"P=25 and Q=35, after a net leftward demand shift of 15."},{"id":"D","text":"P=15 and Q=25 because the full 15-unit demand shift becomes a $15 price fall."}],"explanation":"The new demand is Qd=85-2P. Equating it to 10+P gives P=25 and Q=35, compared with P=30 and Q=40 initially. A normal good can experience falling demand despite rising income when other determinants outweigh that effect.","graph":null,"data":null,"correct_option":"C","option_feedback":{"A":"An increase in a complement's price reduces demand.","B":"The signed effects must be weighted by their stated magnitudes.","C":"The demand intercept changes by 0.5(20)+3(5)-4(10)=-15.","D":"A horizontal shift does not translate one-for-one into a price change."},"estimated_minutes":3},{"id":"DS-10","title":"Sales rise while a controlled price stays fixed","topic_id":"DS","difficulty":"hard","skills":["demand shift vs movement","price floor","observed transactions"],"stem":"A market has Qd=100-2P, Qs=10+P, and a price floor of 40 without government purchases. Demand then rises to Qd=120-2P. Sellers can supply all demanded units at the floor. Which explanation fits the outcome?","options":[{"id":"A","text":"Sales rise because buyers move down an unchanged demand curve."},{"id":"B","text":"The market clears at P=40 because any increase in demand eliminates a surplus."},{"id":"C","text":"Sales rise from 20 to 40 at the unchanged price of 40, reflecting a demand shift and a smaller excess of supply."},{"id":"D","text":"Sales remain 20 because a fixed price fixes quantity demanded permanently."}],"explanation":"Initially sales are Qd(40)=20 against offered supply 50. After the shift, sales are 120-80=40; the excess offered falls from 30 to 10. An unchanged observed price does not imply unchanged demand.","graph":null,"data":null,"correct_option":"C","option_feedback":{"A":"The transaction price did not fall, and the demand equation changed.","B":"At 40, supply is 50 and new demand is 40, leaving 10 units of excess supply.","C":"The floor remains above the new unrestricted equilibrium price of 110/3.","D":"Nonprice determinants can change demand at a constant price."},"estimated_minutes":3},{"id":"DS-11","title":"A ceiling changes who gets scarce spaces","topic_id":"DS","difficulty":"very_hard","skills":["price controls","rationing","gains from trade"],"stem":"Three parking spaces are available for one day. Their incremental resource cost is zero, and supply is fixed at three. Four drivers value a space at $100, $90, $60, and $40. Initially a $50 price allocates spaces to the three highest-valuing drivers. A $20 ceiling is introduced, and a specified lottery outcome assigns spaces to the $100, $60, and $40 drivers. Ignore waiting and administrative costs. What happens to total gains from trade, counting buyers and the owner together?","options":[{"id":"A","text":"They fall by $50 because a $90 use is replaced by a $40 use."},{"id":"B","text":"They rise by $90 because each of three drivers pays $30 less."},{"id":"C","text":"They are unchanged because the same three spaces are occupied."},{"id":"D","text":"They fall by $90, equal to the reduction in the owner's revenue."}],"explanation":"Initial total value is 100+90+60=$250; after this lottery outcome it is 100+60+40=$200. With zero incremental resource cost, these are total gains from trade. Lower payments redistribute gains, while misallocation reduces their total. The question specifies an outcome, not the lottery's expected effect.","graph":null,"data":null,"correct_option":"A","option_feedback":{"A":"Payments are transfers within the counted group; the allocation loses $50 of value.","B":"The owner's lost receipts offset that payment saving within total gains from trade.","C":"Equal quantities can generate different total value when users differ.","D":"The revenue change is partly a transfer, not itself the loss in total gains."},"estimated_minutes":5},{"id":"DS-12","title":"A subsidy paid to sellers","topic_id":"DS","difficulty":"hard","skills":["subsidy wedge","market adjustment","economic incidence"],"stem":"Qd=100-2Pb and Qs=20+2Ps, where Pb is the buyer price and Ps is the seller's total receipt per unit. A subsidy of $5 per unit is paid to sellers, so Ps=Pb+5. There is no entry during the period. Which equilibrium follows?","options":[{"id":"A","text":"Buyers pay 20, sellers receive 25, and 60 units trade."},{"id":"B","text":"Buyers pay 15, sellers receive 20, and 70 units trade."},{"id":"C","text":"Buyers pay 17.5, sellers receive 22.5, and 65 units trade."},{"id":"D","text":"Buyers pay 22.5, sellers receive 17.5, and 65 units trade."}],"explanation":"Equate 100-2Pb=20+2(Pb+5)=30+2Pb. This gives Pb=17.5, Ps=22.5, and Q=65. Legal receipt of the subsidy does not mean sellers keep its entire economic benefit; equilibrium price adjusts.","graph":null,"data":null,"correct_option":"C","option_feedback":{"A":"At a seller receipt of 25, quantity supplied is 70, not 60.","B":"At a seller receipt of 20, quantity supplied is only 60.","C":"The buyer price falls by 2.5 and the seller receipt rises by 2.5.","D":"This reverses the subsidy wedge; sellers receive more than buyers pay."},"estimated_minutes":3},{"id":"EL-01","title":"Unit elasticity across an interval","topic_id":"EL","difficulty":"hard","skills":["midpoint elasticity","total revenue","arc vs point"],"stem":"Along one unchanged demand curve, price rises from $10 to $12 and quantity falls from 120 to 100. What can be concluded from the midpoint formula and these two observations alone?","options":[{"id":"A","text":"Arc elasticity has magnitude 1 and endpoint revenues are equal; elasticity need not equal 1 at every poin points":[[50,14],[50,20]],"label":"Tax wedge"}]}}}},"data":null,"correct_option":"D","option_feedback":{"A":"A vertical curve prevents its side from adjusting quantity and leads to full incidence on that side.","B":"This reverses which side is perfectly inelastic in the two markets.","C":"Here one side fixes quantity at 50 regardless of the tax-induced price change.","D":"The perfectly inelastic side bears the entire tax in each market."},"estimated_minutes":5},{"id":"EL-10","title":"A large price change under constant elasticity","topic_id":"EL","difficulty":"hard","skills":["constant-elasticity demand","exact vs approximate change","total revenue"],"stem":"Demand is exactly Q=1000/P^2 for P>0. Price rises from 10 to 12. What is the exact percentage change in total revenue, rounded to one decimal place?","options":[{"id":"A","text":"No change because constant elasticity means constant revenue."},{"id":"B","text":"A fall of 16.7%."},{"id":"C","text":"A fall of 40.0%."},{"id":"D","text":"A fall of 20.0%."}],"explanation":"Initial quantity is 1000/100=10 and revenue is 100. New quantity is 1000/144=125/18, giving revenue 250/3. Thus revenue changes by (5/6-1)100%=-16.666...%. The exact quantity decline is about 30.6%, not the local estimate of 40%.","graph":null,"data":null,"correct_option":"B","option_feedback":{"A":"Only constant unit elasticity implies constant revenue; this demand has elasticity magnitude 2.","B":"Revenue is 1000/P, so its ratio is 10/12=5/6.","C":"This applies a local quantity approximation and also mistakes quantity change for revenue change.","D":"That is the first-order revenue prediction (1-2)(20%), not the exact finite change."},"estimated_minutes":3},{"id":"EL-11","title":"Adjustment time changes who bears a tax","topic_id":"EL","difficulty":"very_hard","skills":["time horizon","tax incidence","quantity responsiveness"],"stem":"Compare two local responses around the same baseline price and quantity. In the short run, |Ed|=0.2; after consumers have time to adjust, |Ed|=1.2. Supply elasticity remains 1 in both cases. For an equally small unit tax, which comparison is correct?","options":[{"id":"A","text":"The buyers' share falls from about 83.3% to 45.5%, and the quantity reduction becomes larger."},{"id":"B","text":"The buyers' share rises from 16.7% to 54.5%, and the quantity reduction becomes larger."},{"id":"C","text":"The buyers' share is unchanged because supply elasticity is unchanged."},{"id":"D","text":"The buyers' share falls, so the quantity reduction must become smaller."}],"explanation":"Buyer shares are 1/(1+0.2)=5/6 and 1/(1+1.2)=5/11. The magnitude of the local quantity response to t/P is |Ed|Es/(|Ed|+Es), rising from 1/6 to 6/11. Equal baseline conditions are essential for that quantitative comparison.","graph":null,"data":null,"correct_option":"A","option_feedback":{"A":"More elastic demand shifts more burden to sellers and increases the quantity response under the stated comparison.","B":"These numbers are the sellers' shares.","C":"Incidence depends on both elasticities.","D":"A smaller buyer price increase can coexist with a greater quantity response when demand becomes much more elastic."},"estimated_minutes":5},{"id":"EL-12","title":"The highest revenue is not the highest profit","topic_id":"EL","difficulty":"hard","skills":["revenue vs profit","elasticity reasoning","discrete price comparison"],"stem":"A seller considering four possible prices faces Q=120-2P. Variable cost is $20 per unit, fixed cost is zero, and it can meet all demand. Compare only prices 20, 30, 40, and 50. Which pair identifies the revenue-maximizing and profit-maximizing choices within that set?","options":[{"id":"A","text":"Both are highest at P=50 because the per-unit margin is greatest."},{"id":"B","text":"Revenue is highest at P=30; profit is highest at P=40."},{"id":"C","text":"Revenue is highest at P=40; profit is highest at P=30."},{"id":"D","text":"Both are highest at P=30 because unit elasticity guarantees maximum profit."}],"explanation":"At P=(20,30,40,50), quantities are (80,60,40,20), revenues are (1600,1800,1600,1000), and profits (P-20)Q are (0,600,800,600). More revenue is not necessarily more profit. This is a seller facing downward-sloping demand, not an individual perfectly competitive price taker.","graph":null,"data":{"columns":["Candidate price","Quantity from Q=120-2P"],"rows":[[20,80],[30,60],[40,40],[50,20]]},"correct_option":"B","option_feedback":{"A":"A high margin must be multiplied by the smaller quantity sold.","B":"At 30, revenue is 1,800 and profit 600; at 40, revenue is 1,600 and profit 800.","C":"This reverses the two objectives.","D":"Unit elasticity identifies a revenue optimum here, not the profit optimum with positive marginal cost."},"estimated_minutes":3},{"id":"COST-01","title":"Discrete output and a loss-making firm","topic_id":"COST","difficulty":"very_hard","skills":["incremental cost","global profit comparison","shutdown"],"stem":"A price-taking firm can produce only whole units q=0,...,6. Fixed cost is $30 and unavoidable this period. Variable costs at q=0,...,6 are 0, 12, 20, 27, 36, 50, and 72. Market price is $10. Which decision maximizes profit?","options":[{"id":"A","text":"Produce 4 units, making a $26 economic loss."},{"id":"B","text":"Produce 3 units because the fourth unit raises average variable cost."},{"id":"C","text":"Produce 5 units because selling more spreads fixed cost."},{"id":"D","text":"Shut down because the first unit's marginal cost of $12 exceeds price."}],"explanation":"Revenue minus variable cost at q=0,...,6 is (0,-2,0,3,4,0,-12). The maximum occurs at q=4; profit is 40-36-30=-$26 versus -$30 if shut down. With nonconvex discrete costs, compare feasible total profits rather than stopping at the first unfavorable marginal unit.","graph":null,"data":{"columns":["Output q","Variable cost ($)"],"rows":[[0,0],[1,12],[2,20],[3,27],[4,36],[5,50],[6,72]]},"correct_option":"A","option_feedback":{"A":"At q=4, revenue less variable cost is $4, which is the greatest contribution toward fixed cost.","B":"The fourth unit costs $9 and earns $10, so it improves profit despite raising AVC.","C":"The fifth unit costs $14 but earns only $10.","D":"Later cost savings make the four-unit package worthwhile; a first-unit comparison alone is insufficient."},"estimated_minutes":5},{"id":"COST-02","title":"Two intersections of price and marginal cost","topic_id":"COST","difficulty":"very_hard","skills":["MR=MC limitations","rising marginal cost","profit and shutdown","graph interpretation"],"stem":"A competitive firm has fixed cost 100, VC(q)=q^3-12q^2+60q, and MC(q)=3q^2-24q+60, with q>=0 continuously divisible. Price is 39. Fixed cost is unavoidable. The horizontal price line crosses MC at q=1 and q=7. What is the profit-maximizing action?","options":[{"id":"A","text":"Produce q=7, with an economic loss of 2."},{"id":"B","text":"Produce q=1 because the first MR=MC intersection is always optimal."},{"id":"C","text":"Shut down because neither positive-output intersection yields positive economic profit."},{"id":"D","text":"Produce q=7 and report zero economic profit because P=MC."}],"explanation":"Profit is 39q-100-VC(q). MC falls through P at q=1 and rises through it at q=7. At q=1 profit is -110; at q=7 it is -2; at q=0 it is -100. At larger outputs profit falls without bound, so q=7 is the global optimum. Its AVC is 25, below price.","graph":{"status":"rendered_in_offline_quiz","student_caption":"Plot MC=3q^2-24q+60, AVC=q^2-12q+60, ATC=100/q+q^2-12q+60, and P=39. Mark only the two given MC intersections at q=1 and q=7.","panels":[{"id":"firm","x_label":"Firm output q","y_label":"Dollars per unit","x_range":[0,10],"y_range":[0,160],"curves":[{"id":"mc","label":"MC","equation":"y = 3*x^2 - 24*x + 60","domain":[0,10],"points":[[0.0,60.0],[0.0333333,59.2033333],[0.0666667,58.4133333],[0.1,57.63],[0.1333333,56.8533333],[0.1666667,56.0833333],[0.2,55.32],[0.2333333,54.5633333],[0.2666667 t charge, fully avoidable at q=0. Variable production cost excluding that permit is q^2, MC=2q, and price is 18. Which decision is best?","options":[{"id":"A","text":"Produce q=10 because spreading the permit over ten units makes it irrelevant."},{"id":"B","text":"Produce q=9 because P=18 exceeds the production AVC of 9."},{"id":"C","text":"Produce q=9 because every cost called fixed must be ignored in a shutdown decision."},{"id":"D","text":"Shut down; the best positive-output contribution before the permit is only 81, less than the avoidable $100 charge."}],"explanation":"Conditional on operating, P=MC gives q=9 and the maximum contribution before fixed charges is 18(9)-9^2=81. Paying the avoidable permit reduces that to -19, so operation is worse than closure. The standard P>=min AVC rule assumes all omitted fixed costs are unavoidable in the relevant period.","graph":null,"data":null,"correct_option":"D","option_feedback":{"A":"The permit remains avoidable, and q=10 does not maximize operating contribution.","B":"That comparison omits an additional avoidable operating cost.","C":"Costs are irrelevant only if unchanged by the decision; this permit is saved by shutting down.","D":"The candidate q=9 gives profit 162-81-100-20=-39, versus -20 at shutdown."},"estimated_minutes":5},{"id":"COST-12","title":"Diminishing marginal product with constant returns to scale","topic_id":"COST","difficulty":"very_hard","skills":["production function","short vs long run","diminishing returns vs scale economies"],"stem":"Production is q=sqrt(KL), with rental cost $4 per unit of K and wage $4 per unit of L. In the short run K=16 and its cost is unavoidable. Initially q=16. To reach q=32, compare keeping K fixed against adjusting both inputs optimally in the long run. Which statement is correct?","options":[{"id":"A","text":"Both short-run and long-run ATC rise to 10 because diminishing marginal product applies whenever output grows."},{"id":"B","text":"Long-run ATC falls to 4 because doubling both inputs doubles output."},{"id":"C","text":"Short-run ATC remains 8 because q=sqrt(KL) has constant returns to scale."},{"id":"D","text":"Short-run ATC rises from 8 to 10, but long-run minimum ATC remains 8; diminishing marginal product can coexist with constant returns to scale."}],"explanation":"At q=16, K=L=16 costs 4(16+16)=128, giving ATC=8. With K=16 and q=32, L=q^2/K=64, so TC=4(16+64)=320 and ATC=10. Equal input prices make K=L=32 cost-minimizing in the long run: TC=256 and ATC=8. Doubling both inputs doubles output, even though adding labor alone has diminishing marginal product.","graph":null,"data":null,"correct_option":"D","option_feedback":{"A":"Long-run expansion also raises the formerly fixed input.","B":"Doubling inputs also doubles cost, leaving average cost unchanged.","C":"Constant returns describes proportional changes in both inputs, not a change in L with K fixed.","D":"At fixed K=16, q=32 needs L=64; with both inputs adjustable, K=L=32 suffices."},"estimated_minutes":5}]}</script>

  <script>'use strict';
const BANK = JSON.parse(document.getElementById('bank-data').textContent);

const emptyState = () => ({version:1,mode:'study',topic:'all',difficulty:'all',graphsOnly:false,reviewFilter:'all',reviewIds:[],index:{study:0,review:0},practice:{},records:{},flags:[],exam:null,history:[]});

let graphExplained = false;

  for (const id of Object.keys(QUESTIONS)) {

    if (record && (validOption(record.selected) || record.selected === null)) {

    }

    }
  }

function graphColor(curve,i) {
  const id=curve.id.toLowerCase(),label=curve.label.toLowerCase();
  if(id.includes('atc')||label.includes('atc'))return '#944d80';
  if(id.includes('avc')||label.includes('avc'))return '#286ba2';
  if(id==='mc'||label==='mc')return '#167450';
  if(id==='p'||id==='p0'||id==='p1'||id==='reference'||id==='floor'||id==='ceiling')return '#525e58';
  if(label.includes('supply')||/^s\d$/.test(id))return '#b05b24';
  if(label.includes('demand')||/^d\d$/.test(id))return '#286ba2';
  return ['#286ba2','#b05b24','#167450','#944d80','#59656d'][i%5];
}
function niceTicks(min,max,n=4) {
  const raw=(max-min)/n,power=10**Math.floor(Math.log10(raw)),ratio=raw/power;
  const step=(ratio<=1.5?1:ratio<=3?2:ratio<=7?5:10)*power;
  const result=[];for(let v=Math.ceil(min/step)*step;v<=max+step*0.0001;v+=step)result.push(Number(v.toFixed(8)));
  return result;
}
function renderGraphs() {
  const q=question();if(!q?.graph||!$('graph-panels'))return;
  const explained=answer(q).checked&&graphExplained;
  const container=$('graph-panels');container.innerHTML='';
  for(const panel of q.graph.panels){
    const overlay=explained?q.graph.solution.panels[panel.id]||{}:{};
    if(!panel.curves.length&&!panel.markers.length&&!explained&&q.id!=='OC-09')continue;
    const fig=document.createElement('figure');fig.className='graph-panel';fig.dataset.panel=panel.id;container.append(fig);
    drawPanel(fig,panel,overlay,explained);
    if(explained&&overlay.inset){
      const inset=document.createElement('figure');inset.className='graph-panel';container.append(inset);
      drawPanel(inset,{...panel,...overlay.inset,id:panel.id+'-inset'},overlay,true,true);
    }
  }
  $('graph-note').innerHTML=explained?`<p class="graph-note">${esc(q.graph.solution.note)}</p>`:'';
}
function drawPanel(fig,panel,overlay,explained,inset=false) {
  const width=Math.max(250,fig.clientWidth||400),height=inset?240:Math.min(345,Math.max(285,width*0.72));
  const margin={l:47,r:17,t:35,b:49};const plotW=width-margin.l-margin.r,plotH=height-margin.t-margin.b;
  const [xmin,xmax]=panel.x_range,[ymin,ymax]=panel.y_range;
  const sx=x=>margin.l+(x-xmin)/(xmax-xmin)*plotW,sy=y=>margin.t+(ymax-y)/(ymax-ymin)*plotH;
  const clip='clip-'+(++graphSequence);
  const curves=[...panel.curves,...(overlay.curves||[])];
  const markers=[...panel.markers,...(overlay.markers||[])];
  if(question().id==='OC-09'&&!explained)markers.push({label:'All cloth',x:0,y:13});
  const path=points=>points.map(([x,y],i)=>`${i?'L':'M'}${sx(x).toFixed(2)},${sy(y).toFixed(2)}`).join(' ');
  let svg=`<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="${esc(panel.x_label+' versus '+panel.y_label+(explained?', solution':''))}"><title>${esc(panel.label||panel.x_label+' versus '+panel.y_label)}</title><desc>${esc(explained?question().graph.solution.note:question().graph.student_caption)}</desc><defs><clipPath id="${clip}"><rect x="${margin.l}" y="${margin.t}" width="${plotW}" height="${plotH}"/></clipPath></defs><rect data-chart-frame x="${margin.l}" y="${margin.t}" width="${plotW}" height="${plotH}" fill="#fff" stroke="#dde4df"/>`;
  const text=(x,y,label,anchor='middle',size=11,extra='')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" fill="#536059" font-size="${size}" font-family="inherit" ${extra}>${esc(label)}</text>`;
  for(const t of niceTicks(xmin,xmax,width<360?3:4)){svg+=`<line x1="${sx(t)}" x2="${sx(t)}" y1="${margin.t}" y2="${height-margin.b}" stroke="#e9eeea"/>`+text(sx(t),height-margin.b+18,fmt(t));}
  for(const t of niceTicks(ymin,ymax,4)){svg+=`<line x1="${margin.l}" x2="${width-margin.r}" y1="${sy(t)}" y2="${sy(t)}" stroke="#e9eeea"/>`+text(margin.l-8,sy(t)+4,fmt(t),'end');}
  svg+=text(margin.l,17,panel.y_label,'start',12,'class="axis-title" data-axis="y"')+text(margin.l+plotW/2,height-8,panel.x_label,'middle',12,'class="axis-title" data-axis="x"');
  svg+=`<g clip-path="url(#${clip})">`;
  for(const [i,region] of (overlay.regions||[]).entries())svg+=`<path class="graph-region" d="${path(region.points)} Z" fill="${i?'#286ba2':'#168057'}" fill-opacity=".13"><title>${esc(region.label)}</title></path>`;
  curves.forEach((curve,i)=>{
    const dash=i%2===1?'7 4':(i%4===2?'2 3':'');
    svg+=`<path data-series="${i}" class="graph-curve" d="${path(curve.points)}" fill="none" stroke="${graphColor(curve,i)}" stroke-width="2.3" stroke-dasharray="${dash}" stroke-linejoin="round"><title>${esc(curve.label)}</title></path>`;
  });
  for(const segment of overlay.segments||[])svg+=`<path d="${path(segment.points)}" fill="none" stroke="#167450" stroke-width="3" stroke-dasharray="4 3"><title>${esc(segment.label)}</title></path>`;
  for(const bar of overlay.bars||[]){const bw=plotW/(xmax-xmin)*0.48;svg+=`<rect class="graph-bar" x="${sx(bar.x)-bw/2}" y="${sy(bar.y)}" width="${bw}" height="${sy(0)-sy(bar.y)}" fill="#286ba2" opacity=".8"><title>Worker ${bar.x}: MP ${bar.y}</title></rect>`+text(sx(bar.x),sy(bar.y)-7,bar.y);}
  const visibleMarkers=markers.filter(m=>m.x>=xmin&&m.x<=xmax&&m.y>=ymin&&m.y<=ymax);
  for(const [i,m] of visibleMarkers.entries()){
    if(explained)svg+=`<path d="M${sx(m.x)},${sy(ymin)} L${sx(m.x)},${sy(m.y)} L${sx(xmin)},${sy(m.y)}" fill="none" stroke="#8aa697" stroke-width="1" stroke-dasharray="3 4"/>`;
    svg+=`<circle class="graph-marker" cx="${sx(m.x)}" cy="${sy(m.y)}" r="4" fill="#263f32" stroke="white" stroke-width="1.2"><title>${esc(m.label)}: (${fmt(m.x)}, ${fmt(m.y)})</title></circle>`;
  }
  svg+='</g>';
  // Numbered labels link to coordinates below the plot without crowding curve names.
  const used=[];
  for(const [i,m] of visibleMarkers.entries()){
    const x=sx(m.x),y=sy(m.y);let found;
    for(const [dx,dy] of [[8,-8],[8,17],[-15,-8],[-15,17],[16,4],[-24,4]]){
      const box={x:x+dx,y:y+dy-10,w:15,h:14};
      if(box.x<margin.l||box.x+box.w>width-margin.r||box.y<margin.t||box.y+box.h>height-margin.b)continue;
      if(used.some(b=>box.x<b.x+b.w+3&&box.x+box.w+3>b.x&&box.y<b.y+b.h+3&&box.y+box.h+3>b.y))continue;
      found=box;break;
    }
    if(found){used.push(found);svg+=text(found.x,found.y+10,String(i+1),'start',11,'font-weight="650"');}
  }
  svg+='</svg>';
  const legend=inset?'':`<div class="graph-legend">${curves.map((curve,i)=>`<button class="legend-item" data-series-toggle="${i}" aria-pressed="true" title="${esc(curve.equation||curve.label)}"><span class="swatch" style="color:${graphColor(curve,i)};border-top-style:${i%2?'dashed':i%4===2?'dotted':'solid'}"></span>${esc(curve.label)}</button>`).join('')}${(overlay.regions||[]).map(r=>`<span class="legend-item"><span class="swatch" style="color:#168057;border-top-width:7px;opacity:.4"></span>${esc(r.label)}</span>`).join('')}</div>`;
  const markersText=visibleMarkers.length?`<div class="marker-list">${visibleMarkers.map((m,i)=>`<span>${i+1}. ${esc(m.label)} (${fmt(m.x)}, ${fmt(m.y)})</span>`).join('')}</div>`:'';
  const panelNames={a:'Panel A',b:'Panel B',alpha:'Alpha',beta:'Beta',total:'Market demand',tp:'Total product',mp:'Marginal product',market:'Industry',firm:'Individual firm',bottles:'Bottles',dozens:'Dozens'};
  const caption=inset?panel.label:question().graph.panels.length>1?(panelNames[panel.id]||panel.id):'';
  fig.innerHTML=(caption?`<figcaption>${esc(caption)}</figcaption>`:'')+svg+legend+markersText;
}

function examPool() {

  const data=new FormData(f),topics=data.getAll('topic');
  return BANK.questions.filter(q=>topics.includes(q.topic_id)&&(data.get('difficulty')==='all'||data.get('difficulty')===q.difficulty)&&(data.get('format')!=='graphs'||q.graph));
}
function updatePool() { const f=$('exam-form');if(!f)return;const count=Math.min(Number(new FormData(f).get('count')),examPool().length);$('exam-pool').textContent=`${count} questions / ${examPool().length} available`;$('start-exam').disabled=!count; }
function startExam() {
  const data=new FormData($('exam-form')),pool=examPool();if(!pool.length)return;

  state.exam={ids:chosen.map(q=>q.id),order:Object.fromEntries(chosen.map(q=>[q.id,shuffled(LETTERS)])),answers:{},index:0,started,deadline:minutes?started+minutes*60000:null,submitted:false,ended:null,showResults:false};
  state.mode='exam';graphExplained=false;save();render();window.scrollTo({top:0,behavior:'instant'});

function score(e=state.exam) { return e.ids.filter(id=>e.answers[id]===QUESTIONS[id].correct_option).length; }
async function submitExam(auto=false) {
  const e=state.exam;if(!e||e.submitted)return;
  const unanswered=e.ids.filter(id=>!e.answers[id]).length;
  if(!auto&&!await confirmAction('Submit this exam?',`${Object.keys(e.answers).length} of ${e.ids.length} answered.${unanswered?' '+unanswered+' unanswered questions will count as incorrect.':''}`,'Submit exam'))return;
  if(e.submitted)return;
  e.submitted=true;e.ended=auto&&e.deadline?e.deadline:Date.now();e.showResults=true;
  for(const id of e.ids)record(id,e.answers[id]||null);
  state.history.unshift({date:new Date(e.ended).toISOString(),total:e.ids.length,correct:score(e)});state.history=state.history.slice(0,10);

function renderResults() {
  const e=state.exam,correct=score(e),answered=Object.keys(e.answers).length,seconds=Math.max(0,Math.round(((e.ended||Date.now())-e.started)/1000));
  $('content').innerHTML=`<section><div class="question-topline"><span class="breadcrumb">Mock exam / Results</span><button class="button text" data-action="new-exam">New exam ${icon('arrow-right')}</button></div><h2>Exam complete</h2><div class="result-summary"><div><small>Score</small><div class="score">${Math.round(correct/e.ids.length*100)}%</div></div><div><small>Correct</small><span class="number">${correct} / ${e.ids.length}</span></div><div><small>Unanswered</small><span class="number">${e.ids.length-answered}</span></div><div><small>Time</small><span class="number">${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}</span></div></div><table class="score-table"><thead><tr><th>Topic</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>${BANK.topics.map(t=>{const chosen=e.ids.filter(id=>QUESTIONS[id].topic_id===t.id);if(!chosen.length)return '';const n=chosen.filter(id=>e.answers[id]===QUESTIONS[id].correct_option).length;return `<tr><td>${esc(TOPIC_NAMES[t.id])}</td><td>${n} / ${chosen.length}</td><td>${Math.round(n/chosen.length*100)}%</td></tr>`;}).join('')}</tbody></table><div class="result-actions"><button class="button primary" data-action="review-exam">Review answers ${icon('arrow-right')}</button><button class="button" data-action="missed-exam">Revisit missed questions</button></div><div class="result-question-list">${e.ids.map((id,i)=>`<button class="result-question" data-exam-question="${i}">${icon(e.answers[id]===QUESTIONS[id].correct_option?'check':'x')}<span>${esc(QUESTIONS[id].title)}<small>${id}${!e.answers[id]?' / Unanswered':''}</small></span></button>`).join('')}</div></section>`;
}
function tick(allowSubmit=true) {
  const e=state.exam;if(!e)return;
  const remaining=e.deadline?Math.max(0,Math.ceil((e.deadline-Date.now())/1000)):null;
  document.querySelectorAll('[data-timer]').forEach(el=>{el.textContent=e.submitted?'Submitted':remaining===null?'Untimed':`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;el.classList.toggle('urgent',remaining!==null&&remaining<300&&!e.submitted);});
  if(allowSubmit&&e.deadline&&remaining===0&&!e.submitted)submitExam(true);
}

$('topics').addEventListener('click',event=>{const b=event.target.closest('[data-topic]');if(!b||b.disabled)return;state.topic=b.dataset.topic;applyFilters();});
$('question-map').addEventListener('click',event=>{const b=event.target.closest('[data-jump]');if(b)jump(Number(b.dataset.jump));});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>switchMode(b.dataset.mode)));
$('difficulty').addEventListener('change',event=>{state.difficulty=event.target.value;applyFilters();});
$('graphs-only').addEventListener('change',event=>{state.graphsOnly=event.target.checked;applyFilters();});
$('review-filter').addEventListener('change',event=>{state.reviewFilter=event.target.value;applyFilters();});
$('menu').addEventListener('click',()=>{const open=document.querySelector('.app-layout').classList.toggle('menu-open');$('menu').setAttribute('aria-expanded',open);});
$('content').addEventListener('change',event=>{
  if(event.target.closest('#exam-form')){updatePool();return;}
  if(event.target.name!=='answer')return;
  const q=question(),selected=event.target.value;if(!validOption(selected)||!q||answer(q).checked)return;
  if(state.mode==='exam'){
    if(state.exam.deadline&&Date.now()>=state.exam.deadline){submitExam(true);return;}
    state.exam.answers[q.id]=selected;
  }else state.practice[q.id]={selected,checked:false};
  save();render();$('option-'+selected)?.focus({preventScroll:true});
});
$('content').addEventListener('submit',event=>{if(event.target.id==='exam-form'){event.preventDefault();startExam();}});
$('content').addEventListener('click',async event=>{
  const series=event.target.closest('[data-series-toggle]');
  if(series){const visible=series.getAttribute('aria-pressed')==='true';series.setAttribute('aria-pressed',!visible);series.closest('figure').querySelector(`[data-series="${series.dataset.seriesToggle}"]`).style.display=visible?'none':'';return;}
  const layer=event.target.closest('[data-graph-layer]');if(layer){graphExplained=layer.dataset.graphLayer==='solution';renderQuestion();icons();return;}
  const resultQ=event.target.closest('[data-exam-question]');if(resultQ){jump(Number(resultQ.dataset.examQuestion));return;}
  const action=event.target.closest('[data-action]')?.dataset.action;if(!action)return;
  const q=question();
  switch(action){
    case 'next':jump(index()+1);break;
    case 'previous':jump(index()-1);break;
    case 'check':{const a=state.practice[q.id];if(!a?.selected||a.checked)return;a.checked=true;record(q.id,a.selected);graphExplained=true;save();render();$('solution')?.querySelector('h3').focus({preventScroll:true});break;}
    case 'retry':delete state.practice[q.id];graphExplained=false;save();render();break;
    case 'flag':state.flags=state.flags.includes(q.id)?state.flags.filter(id=>id!==q.id):[...state.flags,q.id];save();render();break;
    case 'submit-exam':await submitExam();break;
    case 'resume-exam':switchMode('exam');break;
    case 'results':state.exam.showResults=true;save();render();break;
    case 'review-exam':jump(0);break;
    case 'new-exam':state.exam=null;save();render();break;
    case 'missed-exam':{const missed=state.exam.ids.filter(id=>state.exam.answers[id]!==QUESTIONS[id].correct_option);state.mode='review';state.topic='all';state.difficulty='all';state.graphsOnly=false;state.reviewFilter='incorrect';state.reviewIds=missed;state.index.review=0;for(const id of missed)delete state.practice[id];graphExplained=false;save();render();break;}
    case 'study':switchMode('study');break;
    case 'clear-filters':state.topic='all';state.difficulty='all';state.graphsOnly=false;applyFilters();break;
  }
});
$('export').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({format:'ceibs-microeconomics-progress',exported:new Date().toISOString(),state},null,2)],{type:'application/json'});
  const link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download='microeconomics-progress-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress exported.');
});
$('import').addEventListener('click',()=>$('import-file').click());
$('import-file').addEventListener('change',async event=>{
  const file=event.target.files[0];if(!file)return;
  try{
    if(file.size>2000000)throw new Error('This file is too large to be a progress backup.');
    const payload=JSON.parse(await file.text());if(payload.format!=='ceibs-microeconomics-progress')throw new Error('Choose a progress backup exported by this quiz.');
    const incoming=normalize(payload.state);
    if(await confirmAction('Import saved progress?','This replaces the progress currently saved in this browser.','Import')){state=incoming;graphExplained=false;save();render();tick();toast('Progress restored.');}
  }catch(error){toast(error.message||'Could not read this backup.');}
  event.target.value='';
});
$('reset').addEventListener('click',async()=>{if(await confirmAction('Reset all progress?','This clears your answers, flags, and exam history in this browser.','Reset progress')){state=emptyState();graphExplained=false;save();render();toast('Progress reset.');}});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(renderGraphs,120);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
window.addEventListener('pageshow',()=>tick());
render();tick();setInterval(()=>tick(),1000);
</script>
</body>
</html>
